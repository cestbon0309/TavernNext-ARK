<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>日常助手</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #10131a;
            color: #f4f6fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(circle at 15% 0%, rgba(81, 105, 165, 0.25), transparent 38%),
                linear-gradient(180deg, #151a24 0%, #0d1016 100%);
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 68px;
            padding: 12px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(14, 18, 25, 0.78);
        }

        .avatar {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: linear-gradient(145deg, #7a8fc7, #536693);
            color: #fff;
            font-size: 20px;
            font-weight: 700;
        }

        .title {
            flex: 1;
        }

        .title strong,
        .title span {
            display: block;
        }

        .title strong {
            font-size: 17px;
            letter-spacing: 0.02em;
        }

        .title span {
            margin-top: 3px;
            color: #9aa6bd;
            font-size: 12px;
        }

        main {
            width: min(760px, 100%);
            margin: 0 auto;
            flex: 1;
            padding: 22px 16px 110px;
        }

        .date {
            margin: 4px 0 24px;
            color: #7f8ba1;
            font-size: 12px;
            text-align: center;
        }

        .message {
            display: flex;
            gap: 10px;
            margin: 0 0 20px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: min(82%, 580px);
            padding: 13px 15px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.65;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
        }

        .assistant .bubble {
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-top-left-radius: 6px;
            background: rgba(36, 43, 57, 0.92);
        }

        .user .bubble {
            border-top-right-radius: 6px;
            background: linear-gradient(145deg, #566f9f, #405880);
        }

        .bubble p {
            margin: 0 0 9px;
        }

        .bubble p:last-child {
            margin-bottom: 0;
        }

        .plan {
            margin: 10px 0 0;
            padding-left: 20px;
        }

        .plan li {
            margin: 7px 0;
        }

        footer {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            background: linear-gradient(180deg, transparent, rgba(10, 13, 18, 0.96) 28%);
        }

        .composer {
            width: min(728px, 100%);
            min-height: 52px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            background: #1c222e;
            color: #7f8ba1;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <div class="avatar">日</div>
            <div class="title">
                <strong>日常助手</strong>
                <span>随时为你整理生活计划</span>
            </div>
        </header>
        <main>
            <div class="date">今天</div>
            <div class="message user">
                <div class="bubble">帮我安排一个轻松的周末计划，想留一点时间看书。</div>
            </div>
            <div class="message assistant">
                <div class="bubble">
                    <p>可以把节奏放慢一些，不用安排得太满：</p>
                    <ul class="plan">
                        <li>上午睡到自然醒，吃一顿简单的早餐。</li>
                        <li>午后散步四十分钟，顺路买喜欢的饮品。</li>
                        <li>傍晚留一小时阅读，再整理下周的待办。</li>
                    </ul>
                </div>
            </div>
            <div class="message user">
                <div class="bubble">如果是阴天，有什么室内备选？</div>
            </div>
            <div class="message assistant">
                <div class="bubble">
                    <p>可以改成室内版本：上午整理房间并播放轻音乐，下午去书店或咖啡馆阅读，晚上看一部轻松的电影。</p>
                    <p>重点是只保留两到三件真正想做的事，让周末有足够的空白。</p>
                </div>
            </div>
        </main>
        <footer>
            <div class="composer">输入消息...</div>
        </footer>
    </div>
</body>
</html>
